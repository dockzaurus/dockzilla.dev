name: CI

# Checks gate every deploy: `check` must be green before anything reaches Netlify.
# A pull request then gets an aliased preview; a push to master goes to production.
on:
  pull_request:
  push:
    branches: [master]

# One run per branch/PR. A new push to a PR supersedes the one in flight; master
# runs queue instead, so a production deploy is never cancelled mid-upload.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NETLIFY_CLI: netlify-cli@27.1.1

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: astro check
        run: pnpm check

      - name: astro build
        run: pnpm build
        env:
          # Analytics only ships from master, so preview traffic never lands in
          # PostHog. Unset, `src/lib/analytics.ts` is a no-op and posthog-js is
          # dropped from the bundle.
          PUBLIC_POSTHOG_KEY: ${{ github.ref == 'refs/heads/master' && secrets.PUBLIC_POSTHOG_KEY || '' }}

      # Both deploy jobs ship this exact artifact — the bits that passed the checks
      # are the bits that go out, and neither job rebuilds.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  preview:
    name: Deploy preview
    needs: check
    # Forks cannot read the Netlify secrets, so skip rather than fail.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # Only .nvmrc is needed here; the build itself is downloaded, not rebuilt.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Read as an env var, never interpolated into the script: a PR title is
          # attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy \
            --dir=dist \
            --alias="deploy-preview-$PR_NUMBER" \
            --message="PR #$PR_NUMBER: $PR_TITLE" \
            --json > deploy.json
          echo "url=$(jq -er '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "logs=$(jq -r '.logs // empty' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          LOGS_URL: ${{ steps.deploy.outputs.logs }}
        with:
          script: |
            // One sticky comment per PR, rewritten on each push.
            const marker = '<!-- netlify-preview -->';
            const body = [
              marker,
              '### Deploy preview ready',
              '',
              '| | |',
              '| --- | --- |',
              `| Preview | ${process.env.PREVIEW_URL} |`,
              `| Commit | \`${context.payload.pull_request.head.sha.slice(0, 7)}\` |`,
              `| Logs | ${process.env.LOGS_URL} |`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  production:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Subject line via git rather than the event payload: a multi-line commit
          # message interpolated into YAML would break the step.
          npx --yes "$NETLIFY_CLI" deploy \
            --dir=dist \
            --prod \
            --message="$(git log -1 --pretty=%s)" \
            --json > deploy.json
          echo "url=$(jq -er '.url' deploy.json)" >> "$GITHUB_OUTPUT"
