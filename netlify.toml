# Deploys are driven by GitHub Actions (.github/workflows/ci.yml), which uploads a
# prebuilt `dist/` with the Netlify CLI. REQUIRED SETUP: disable Netlify's git
# integration in the Netlify UI, or its own builds race the Actions deploy. The
# settings below are the fallback for a manual `netlify deploy --build`.

[build]
	command = "pnpm build"
	publish = "dist"

[build.environment]
	NODE_VERSION = "24"

# Astro fingerprints everything under /_astro/, so it can be cached forever.
[[headers]]
	for = "/_astro/*"

	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"

# First-party PostHog ingestion. Browsers talk to our own origin (/ingest) instead
# of *.i.posthog.com, which ad blockers and Safari ITP drop. The project is on US
# cloud, so these are the US hosts — change them if the project ever moves region.
# Order matters: the static rule must come before the /ingest/* catch-all, and both
# need status 200 (rewrite, not redirect) and force = true to beat static files.
[[redirects]]
	from = "/ingest/static/*"
	to = "https://us-assets.i.posthog.com/static/:splat"
	status = 200
	force = true

[[redirects]]
	from = "/ingest/*"
	to = "https://us.i.posthog.com/:splat"
	status = 200
	force = true
